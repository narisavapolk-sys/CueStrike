# Unity Compile Gate
name: Unity Compile Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile:
    name: Unity batchmode compile check (editmode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Unity compile + EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.4.4f1
          testMode: editmode
          artifactsPath: compile-gate-results
