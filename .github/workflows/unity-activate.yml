# Acquire Unity Activation File
# One-time helper (workflow_dispatch) that produces the Unity activation file
# (.alf) needed to enable the CI compile gate.
#
# Steps:
#   1. Click "Run workflow" on this action.
#   2. Download the Unity_v6000.x.alf artifact.
#   3. Open https://license.unity3d.com/manual, upload the .alf, and get a .ulf file.
#   4. Copy the whole .ulf content and save it as the UNITY_LICENSE repo secret.

name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Create Unity activation file
    runs-on: ubuntu-latest
    steps:
      # 1. ขอไฟล์ Activation (.alf) จาก Unity
      - name: Request manual activation file
        id: get_alf
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.4.4f1

      # 2. อัปโหลดไฟล์ .alf ขึ้น Artifact ให้ดาวน์โหลดได้
      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.4.4f1.alf
          path: ${{ steps.get_alf.outputs.filePath }}
